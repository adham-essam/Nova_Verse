<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nova Verse Academy logo mark">
  <defs>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <radialGradient id="planetShade" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- orbital ring -->
  <ellipse cx="50" cy="52" rx="46" ry="18" fill="none" stroke="#FFD166" stroke-width="1.6" opacity="0.55" transform="rotate(-18 50 52)"/>

  <!-- tiny stars -->
  <circle cx="10" cy="20" r="1.4" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="90" cy="30" r="1" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="85" cy="78" r="1.6" fill="#00D4FF" opacity="0.8"/>
  <circle cx="14" cy="80" r="1" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="50" cy="6" r="1.2" fill="#FFFFFF" opacity="0.7"/>

  <!-- planet (the letter O) -->
  <circle cx="50" cy="50" r="30" fill="url(#planetGrad)"/>
  <circle cx="50" cy="50" r="30" fill="url(#planetShade)"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
</svg>
