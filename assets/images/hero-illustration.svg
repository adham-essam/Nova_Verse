<svg viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="طفل يستخدم حاسوبًا محمولًا مع شفرة برمجية وكواكب عائمة">
  <defs>
    <linearGradient id="glowA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="glowB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="haze" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151A3A"/>
      <stop offset="100%" stop-color="#0B1026"/>
    </linearGradient>
  </defs>

  <!-- ambient haze -->
  <circle cx="280" cy="260" r="230" fill="url(#haze)"/>

  <!-- orbit rings -->
  <ellipse cx="280" cy="270" rx="240" ry="240" fill="none" stroke="rgba(255,255,255,0.06)" stroke-dasharray="2 8"/>
  <ellipse cx="280" cy="270" rx="185" ry="185" fill="none" stroke="rgba(255,255,255,0.05)"/>

  <!-- distant planets -->
  <circle cx="460" cy="110" r="26" fill="url(#glowA)" opacity="0.9"/>
  <ellipse cx="460" cy="110" rx="42" ry="10" fill="none" stroke="#FFD166" stroke-width="2" opacity="0.5" transform="rotate(-20 460 110)"/>
  <circle cx="70" cy="150" r="16" fill="url(#glowB)" opacity="0.85"/>
  <circle cx="95" cy="420" r="10" fill="#FFD166" opacity="0.8"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="60" r="1.6" opacity="0.8"/>
    <circle cx="120" cy="30" r="1.2" opacity="0.6"/>
    <circle cx="520" cy="220" r="1.6" opacity="0.7"/>
    <circle cx="500" cy="380" r="1.2" opacity="0.6"/>
    <circle cx="30" cy="300" r="1.4" opacity="0.7"/>
    <circle cx="200" cy="20" r="1" opacity="0.5"/>
    <circle cx="380" cy="470" r="1.4" opacity="0.6"/>
  </g>

  <!-- floating code panel (top right) -->
  <g transform="translate(350,60)">
    <rect width="150" height="92" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <circle cx="18" cy="18" r="3.5" fill="#FF6B6B"/>
    <circle cx="30" cy="18" r="3.5" fill="#FFD166"/>
    <circle cx="42" cy="18" r="3.5" fill="#06D6A0"/>
    <rect x="16" y="34" width="70" height="6" rx="3" fill="url(#glowA)"/>
    <rect x="16" y="48" width="100" height="6" rx="3" fill="rgba(255,255,255,0.25)"/>
    <rect x="16" y="62" width="55" height="6" rx="3" fill="rgba(255,255,255,0.18)"/>
    <rect x="16" y="76" width="80" height="6" rx="3" fill="url(#glowB)"/>
  </g>

  <!-- Python badge -->
  <g transform="translate(60,240)">
    <circle r="26" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.16)"/>
    <text x="0" y="7" text-anchor="middle" font-family="Cairo, sans-serif" font-size="14" font-weight="700" fill="#FFD166">Py</text>
  </g>

  <!-- Scratch badge -->
  <g transform="translate(480,300)">
    <circle r="26" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.16)"/>
    <text x="0" y="7" text-anchor="middle" font-family="Cairo, sans-serif" font-size="12" font-weight="700" fill="#00D4FF">Sc</text>
  </g>

  <!-- desk / laptop -->
  <g transform="translate(180,300)">
    <rect x="-10" y="120" width="220" height="14" rx="7" fill="url(#deskGrad)"/>
    <!-- laptop base -->
    <path d="M10 118 L190 118 L205 132 L-5 132 Z" fill="rgba(255,255,255,0.08)"/>
    <!-- laptop screen -->
    <rect x="30" y="10" width="140" height="108" rx="8" fill="#0B1026" stroke="rgba(255,255,255,0.14)"/>
    <rect x="42" y="24" width="116" height="80" rx="4" fill="rgba(108,99,255,0.12)"/>
    <rect x="50" y="34" width="60" height="5" rx="2.5" fill="url(#glowA)"/>
    <rect x="50" y="46" width="88" height="5" rx="2.5" fill="rgba(255,255,255,0.3)"/>
    <rect x="50" y="58" width="40" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>
    <rect x="50" y="70" width="70" height="5" rx="2.5" fill="url(#glowB)"/>
    <rect x="50" y="82" width="50" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>
  </g>

  <!-- child silhouette (minimal, geometric, non-childish styling) -->
  <g transform="translate(280,300)">
    <path d="M-46 130 C-46 78 -24 46 0 46 C24 46 46 78 46 130 Z" fill="#151A3A" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="0" cy="10" r="30" fill="#1C2350" stroke="rgba(255,255,255,0.12)"/>
    <path d="M-30 4 C-30 -18 -16 -30 0 -30 C16 -30 30 -18 30 4 C30 10 26 10 20 6 C10 0 -10 0 -20 6 C-26 10 -30 10 -30 4 Z" fill="url(#glowA)" opacity="0.85"/>
  </g>
</svg>
